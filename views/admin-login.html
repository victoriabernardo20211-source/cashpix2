<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashPix — Acesso restrito</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #faf9f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 18px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.08); margin: 1rem; }
    .logo { text-align: center; font-size: 1.8rem; font-weight: 800; color: #22c55e; margin-bottom: .25rem; }
    .subtitle { text-align: center; color: #9ca3af; font-size: .9rem; margin-bottom: 2rem; }
    .input-group { margin-bottom: 1.1rem; }
    .input-group label { display: block; font-size: .85rem; font-weight: 500; color: #374151; margin-bottom: .4rem; }
    .input-group input { width: 100%; padding: .8rem 1rem; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color .15s; }
    .input-group input:focus { border-color: #22c55e; }
    .btn { width: 100%; padding: .9rem; background: #22c55e; color: #fff; font-size: 1rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; margin-top: .5rem; transition: opacity .15s; }
    .btn:hover { opacity: .9; }
    .alert { background: #fef2f2; color: #b91c1c; padding: .75rem 1rem; border-radius: 10px; font-size: .9rem; margin-bottom: 1.25rem; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💚 CashPix</div>
    <div class="subtitle">Acesso ao painel administrativo</div>
    {{erro}}
    <form method="POST" action="/{{admin_path}}/login" autocomplete="off">
      <div class="input-group"><label for="email">E-mail</label><input type="email" id="email" name="email" required autocomplete="username" placeholder="seu@email.com"></div>
      <div class="input-group"><label for="senha">Senha</label><input type="password" id="senha" name="senha" required autocomplete="current-password" placeholder="••••••••"></div>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</body>
</html>
